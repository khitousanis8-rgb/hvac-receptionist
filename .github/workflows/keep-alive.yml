name: Keep Render Backend Awake

on:
  schedule:
    # Run every 10 minutes to prevent Render free instance from spinning down
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Render Health Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive ping
        run: |
          echo "Pinging Render backend at https://hvac-receptionist.onrender.com/health"
          curl -sS -m 40 -f https://hvac-receptionist.onrender.com/health || echo "Initial ping triggered wake-up"
