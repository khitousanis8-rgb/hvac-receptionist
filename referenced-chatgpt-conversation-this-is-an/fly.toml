# Fly.io configuration — API + agent worker in ONE machine (free org limit).
# Deploy: fly deploy

app = "hvac-receptionist"
primary_region = "cdg"

[build]
  dockerfile = "backend/Dockerfile"

[processes]
  app = "sh /app/start.sh"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Persist the SQLite database across deploys/restarts:
#   fly volumes create hvac_data --size 1 --region cdg
# then uncomment:
#[mounts]
#  source = "hvac_data"
#  destination = "/data"
# and set DATABASE_URL=sqlite:////data/hvac_receptionist.db as a secret.