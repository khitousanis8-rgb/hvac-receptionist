# Fly.io configuration — API + agent worker in one app.
# Deploy: fly launch --no-deploy && fly secrets set ... && fly deploy

app = "hvac-receptionist"
primary_region = "cdg"

[build]
  dockerfile = "backend/Dockerfile"

# Both processes run on separate machines; scale each with:
#   fly scale count api=1 worker=1
[processes]
  api = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
  worker = "python -m app.agent.worker start"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["api"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Persist the SQLite database across deploys/restarts:
#   fly volumes create hvac_data --size 1 --region cdg
# then uncomment:
#[mounts]
#  source = "hvac_data"
#  destination = "/data"
# and set DATABASE_URL=sqlite:////data/hvac_receptionist.db as a secret.