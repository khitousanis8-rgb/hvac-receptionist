# Render.com blueprint — Kokoro chat API in one free web service.
# Render reads this file automatically when you create a service from the repo.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: hvac-receptionist
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    # Set these in the Render dashboard (Environment tab) — do NOT commit secrets:
    # APP_ENV, BUSINESS_* (company info), ADMIN_API_KEY, LLM_API_KEY, LLM_BASE_URL,
    # LLM_MODEL, CORS_ORIGINS (your Vercel URL after the dashboard deploy).
    # Leave ENABLE_LIVEKIT_WORKER=false for the in-browser Kokoro flow.
